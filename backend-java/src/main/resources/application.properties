server.port=5000

spring.application.name=habit-tracker

# ==========================================
# Database: MySQL
# Set DB_USER / DB_PASSWORD env vars before starting.
# Defaults are "habit" / "habit123" for local dev.
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/habit_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:habit}
spring.datasource.password=${DB_PASSWORD:habit123}

# Let Hibernate detect the MySQL dialect automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# Switch back to H2 file mode: uncomment the
